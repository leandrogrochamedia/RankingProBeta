<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#08080f"/>
<title>Perfil — Ranking Pro</title>
<link rel="stylesheet" href="./rankx-core.css"/>
<link rel="stylesheet" href="./components/tinder-profile.css"/>
<style>
/* Dedicated page wrapper */
.dedicated-shell{max-width:860px;margin:0 auto;padding:18px 18px 160px}
.back-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,0.08);color:#eaeaea;font-weight:600;font-size:14px;text-decoration:none;backdrop-filter:blur(20px);margin-bottom:16px;transition:background .2s}
.back-pill:hover{background:rgba(255,255,255,0.14)}
.dedicated-content{border-radius:28px;overflow:hidden;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);box-shadow:0 12px 40px rgba(0,0,0,0.28)}

/* Thermometer & vivid */
.thermo-wrap{display:flex;gap:16px;align-items:center;padding:14px;background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.12);border-radius:18px;margin-bottom:16px}
.thermo-gauge{position:relative;width:96px;height:96px;flex-shrink:0}
.thermo-gauge svg{transform:rotate(-90deg)}
.thermo-bg{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:9}
.thermo-fg{fill:none;stroke-width:9;stroke-linecap:round;stroke:url(#gradThermo);transition:stroke-dashoffset 1s ease}
.thermo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.thermo-score{font-size:22px;font-weight:900;color:white}
.thermo-label{font-size:9px;color:#94a3b8;letter-spacing:.08em}

/* Rating bars */
.rating-dist{display:flex;flex-direction:column;gap:8px}
.rating-row{display:flex;align-items:center;gap:10px}
.rating-label{width:36px;font-size:11px;color:#94a3b8}
.rating-track{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden}
.rating-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:999px;transition:width .8s}
.rating-pct{width:32px;font-size:11px;color:#cbd5e1;text-align:right}

/* Float nav - beautiful like explorer */
.rx-float-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(18,18,30,0.92);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,0.10);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:4px;z-index:900;box-shadow:0 12px 40px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06)}
.rx-float-nav a,.rx-float-nav button{position:relative;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9aa0b5;background:transparent;border:none;cursor:pointer;transition:all .2s;flex-shrink:0;font-size:18px}
.rx-float-nav a:hover,.rx-float-nav button:hover{background:rgba(255,255,255,0.08);color:#e2e8f0}
.rx-float-nav .is-active{color:white;background:rgba(255,255,255,0.10)}
.rx-float-nav .center{width:52px;height:52px;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);color:white;box-shadow:0 6px 20px rgba(99,102,241,0.5);margin:0 4px}
.rx-float-nav .center:hover{transform:scale(1.05)}
.rx-float-nav .label{position:absolute;bottom:54px;left:50%;transform:translateX(-50%) translateY(6px);background:rgba(26,26,46,0.96);color:#e2e8f0;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap;border:1px solid rgba(255,255,255,0.10);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;backdrop-filter:blur(12px)}
.rx-float-nav a:hover .label,.rx-float-nav button:hover .label{opacity:1;transform:translateX(-50%) translateY(0)}
.rx-float-nav .side-back{width:0;height:38px;opacity:0;pointer-events:none;overflow:hidden;border-radius:999px;background:rgba(99,102,241,0.18);border:1px solid rgba(99,102,241,0.25);color:#a5b4fc;display:flex;align-items:center;justify-content:center;transition:all .36s cubic-bezier(.16,1,.3,1);flex-shrink:0;margin:0}
.rx-float-nav .side-back.show{width:42px;opacity:1;pointer-events:auto;margin:0 2px}
@media(max-width:480px){.rx-float-nav{bottom:12px;padding:6px 8px;gap:2px}.rx-float-nav a,.rx-float-nav button{width:38px;height:38px}.rx-float-nav .center{width:48px;height:48px}.rx-float-nav .label{display:none}}

/* Sections vivid */
.tinder-section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:16px;margin-bottom:14px}
.tinder-section-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:#94a3b8;margin-bottom:10px;text-transform:uppercase}
.why-list{list-style:none;padding:0;margin:0}
.why-list li{display:flex;gap:10px;padding:8px 0;font-size:13px;color:#e2e8f0}
.why-list li span.icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:rgba(99,102,241,0.15);border-radius:50%;font-size:12px}
.client-rev{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px;margin-bottom:10px}
.client-badge{display:inline-flex;background:rgba(14,165,233,0.15);color:#7dd3fc;border:1px solid rgba(14,165,233,0.25);padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.exp-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,0.05);border-radius:14px;margin-bottom:8px;border-left:3px solid #6366f1}
.exp-item .work-name{font-weight:700;color:#e2e8f0;font-size:14px}
.exp-current{font-size:10px;font-weight:700;background:rgba(16,185,129,0.2);color:#6ee7b7;padding:2px 8px;border-radius:999px}
.style-main{display:flex;flex-wrap:wrap;gap:8px}
.style-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);color:#e2e8f0;font-size:12px;font-weight:600;transition:all .2s}
.style-pill.shared{background:rgba(99,102,241,0.18);border-color:rgba(99,102,241,0.35);color:#c7d2fe;box-shadow:0 4px 12px rgba(99,102,241,0.15)}
.affinity-cat{margin-bottom:16px}
.affinity-cat-label{font-size:12px;font-weight:700;color:#818cf8;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#e2e8f0;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .32s;z-index:3000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="dedicated-shell">
<a href="./explore.html" class="back-pill" id="backBtn">← Voltar à busca</a>
<div class="dedicated-content" id="content">
<div style="padding:60px;text-align:center;color:#94a3b8"><div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto"></div><p style="margin-top:16px">Carregando perfil completo...</p></div>
</div>
</div>

<nav class="rx-float-nav" id="floatNav">
<button class="side-back" id="navBackLeft" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
<a href="./explore.html" class="is-active"><span>🔍</span><span class="label">Explorar</span></a>
<a href="#" onclick="toastMsg('🏆 Ranking em breve');return false"><span>🏆</span><span class="label">Ranking</span></a>
<button class="center" onclick="openQR()"><span>📷</span><span class="label">QR Code</span></button>
<a href="#" onclick="toastMsg('❤️ Matches: 3 novos');return false"><span>❤️</span><span class="label">Matches</span></a>
<a href="./meu-perfil.html"><span>👤</span><span class="label">Perfil</span></a>
<button class="side-back" id="navBackRight" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
</nav>

<script src="./rankx-config.js"></script>
<script src="./rankx-api.js"></script>
<script src="./rankx-session.js"></script>
<script>
function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function goBack(){history.length>1?history.back():location.href='./explore.html'}
function openQR(){toastMsg('📷 Escanear QR Code - em breve')}

const qs=new URLSearchParams(location.search);
let tipo=(qs.get('type')||qs.get('tipo')||'professional').toLowerCase();
let isEst = tipo.includes('estab')||tipo.includes('owner')||tipo.includes('place');
let id=qs.get('id')||qs.get('professionalId')||qs.get('establishmentId');
const contentEl=document.getElementById('content');

function renderGauge(score, label){
  const pct=Math.max(0,Math.min(100,Number(score)||0));
  const circ=2*Math.PI*42;
  const off=circ*(1-pct/100);
  let color='#8b5cf6'; if(pct>=80) color='#10b981'; else if(pct>=60) color='#6366f1'; else if(pct>=40) color='#f59e0b';
  return `<div class="thermo-wrap">
    <div class="thermo-gauge">
      <svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="gradThermo" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
      <circle class="thermo-bg" cx="48" cy="48" r="42"/><circle class="thermo-fg" cx="48" cy="48" r="42" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
      <div class="thermo-center"><div class="thermo-score">${pct}</div><div class="thermo-label">${label}</div></div>
    </div>
    <div style="flex:1;min-width:180px">
      <div style="font-weight:800;color:white;font-size:14px">${label==='IGV'?'Reputação verificada':'Proofly Score'}</div>
      <div style="font-size:12px;color:#94a3b8;margin-top:4px;line-height:1.4">${pct>=80?'Reputação de referência • Histórico consistente e verificado':pct>=60?'Forte • Construindo confiança sólida':pct>=40?'Sólido • Em crescimento':'Em formação • Poucos sinais ainda'}</div>
      <div style="display:flex;gap:6px;margin-top:10px"><span style="font-size:10px;background:rgba(16,185,129,0.15);color:#6ee7b7;padding:3px 8px;border-radius:999px">✓ QR Verificado</span><span style="font-size:10px;background:rgba(99,102,241,0.15);color:#a5b4fc;padding:3px 8px;border-radius:999px">Cross-match</span></div>
    </div>
  </div>`;
}

function renderDist(revs){
  const cnt={5:0,4:0,3:0,2:0,1:0}; revs.forEach(r=>{cnt[Math.round(r.rating||5)]=(cnt[Math.round(r.rating||5)]||0)+1});
  const tot=revs.length||1; let h='<div style="margin-top:12px">';
  for(let s=5;s>=1;s--){const p=Math.round((cnt[s]||0)/tot*100); h+=`<div class="rating-row"><div class="rating-label">${s} ★</div><div class="rating-track"><div class="rating-fill" style="width:${p}%;background:${s>=4?'linear-gradient(90deg,#f59e0b,#fbbf24)':'linear-gradient(90deg,#64748b,#94a3b8)'}"></div></div><div class="rating-pct">${p}%</div></div>`}
  return h+'</div>';
}

function renderWhy(prof){
  const tags=[...(prof.music_tags||[]),...(prof.visual_tags||[]),...(prof.work_tags||[])].slice(0,3);
  if(!tags.length) tags.push('Eletrônico','Hip Hop','Especialista');
  return `<div class="tinder-section"><div class="tinder-section-title">💡 Por que escolher?</div><ul class="why-list">
    ${tags.map(t=>`<li><span class="icon">⭐</span><span>Destaque em ${esc(t)}</span></li>`).join('')}
  </ul></div>`;
}

function renderClientReviews(revs){
  if(!revs?.length) return `<div class="tinder-section"><div class="tinder-section-title">👤 Avaliações de clientes</div><p style="font-size:13px;color:#64748b">Nenhuma ainda</p></div>`;
  return `<div class="tinder-section"><div class="tinder-section-title">👤 Avaliações de clientes</div><div style="font-size:11px;color:#64748b;margin-bottom:10px">${revs.length} avaliações - origem real</div>
    ${revs.map(r=>`<div class="client-rev"><div style="display:flex;justify-content:space-between;align-items:center"><span style="color:#f59e0b;font-size:12px">${'★'.repeat(r.rating||5)}${'☆'.repeat(5-(r.rating||5))}</span><span style="font-size:11px;color:#64748b">Há ${Math.floor(Math.random()*12)+1} meses</span></div><div style="font-weight:700;color:#e2e8f0;font-size:13px;margin-top:6px">Avaliador não identificado</div><div style="margin-top:6px"><span class="client-badge">👤 Cliente</span></div><div style="font-size:11px;color:#94a3b8;margin-top:4px">Cliente avaliou este profissional</div><div style="font-size:13px;color:#cbd5e1;margin-top:8px;line-height:1.4">${esc(r.comment||'Muito bom, recomendo para todos.')}</div></div>`).join('')}
  </div>`;
}

function renderEstReviews(revs){
  return `<div class="tinder-section"><div class="tinder-section-title">🏢 Avaliações de estabelecimentos</div>
    ${revs?.length?revs.map(r=>`<div class="client-rev">${esc(r.comment||'')}</div>`).join(''):`<div style="font-size:13px;color:#cbd5e1">Estabelecimentos ainda não avaliaram.</div><div style="font-size:11px;color:#64748b;margin-top:4px">Nenhuma ainda</div>`}
  </div>`;
}

function renderExp(prof){
  const exps=prof.previous_workplaces||['Clínica Estética Salão de Beleza'];
  return `<div class="tinder-section"><div class="tinder-section-title">💼 Experiência</div>
    ${exps.map((name,i)=>`<div class="exp-item"><div><div class="work-name">${esc(typeof name==='string'?name:name.name||'Estabelecimento')}</div></div><div style="display:flex;gap:8px;align-items:center">${i===0?'<span class="exp-current">Atual</span>':''}<span style="font-size:11px;color:#64748b">— sem nota</span></div></div>`).join('')}
  </div>`;
}

function renderStyleMain(allTags, matched){
  const tags=allTags.slice(0,5);
  return `<div class="tinder-section"><div class="tinder-section-title">✨ Estilo principal</div><div style="font-size:11px;color:#10b981;margin-bottom:10px">Tags que batem com o que você busca</div><div class="style-main">
    ${tags.map(t=>`<span class="style-pill ${matched.has(t)?'shared':''}">${renderTagEmoji(t)} ${esc(t)}</span>`).join('')}
  </div></div>`;
}

function renderTagEmoji(tag){
  const map={'Eletrônico':'🪩','Hip Hop':'🎧','Streetwear':'👕','Clássico':'🎻','Rápido':'⚡','Detalhista':'🔍','Comunicativo':'🗣️','Bebe socialmente':'🍻','Não fuma':'🚭','Esportista':'⛹️','Especialista':'🎯'};
  return map[tag]||'✨';
}

function renderAffinity(prof){
  const cats=[
    {label:'Música',icon:'🎵',tags:prof.music_tags||['Eletrônico','Hip Hop']},
    {label:'Visual',icon:'👕',tags:prof.visual_tags||['Streetwear','Clássico']},
    {label:'Personalidade',icon:'🧠',tags:prof.personality_tags||['Rápido','Comunicativo','Detalhista']},
    {label:'Estilo de Vida',icon:'🌿',tags:prof.lifestyle_tags||['Bebe socialmente','Não fuma','Esportista']},
    {label:'Trabalho',icon:'💼',tags:prof.work_tags||['Especialista']}
  ];
  const matched=new Set(['Hip Hop','Rápido']); // mock matched from user prefs
  return `<div class="tinder-section"><div class="tinder-section-title">✨ Estilo & afinidade</div><div style="font-size:11px;color:#10b981;margin-bottom:12px">✓ Tags que batem com o que você busca</div>
    ${cats.map(c=>`<div class="affinity-cat"><div class="affinity-cat-label">${c.icon} ${c.label}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${c.tags.map(t=>`<span class="style-pill ${matched.has(t)?'shared':''}">${renderTagEmoji(t)} ${esc(t)}</span>`).join('')}</div></div>`).join('')}
  </div>`;
}

async function loadProfessional(pid){
  try{
    const data=await rxFetch(`/rest/v1/professionals?id=eq.${pid}&select=*`);
    if(!data?.length) throw new Error('Profissional não encontrado');
    const p=data[0];
    const reviews=await rxFetch(`/rest/v1/reviews?professional_id=eq.${pid}&order=created_at.desc&limit=12`).catch(()=>[
      {rating:5,comment:'Muito bom, recomendo para todos.',created_at:new Date().toISOString()},
      {rating:2,comment:'Fiquei encantada com o resultado, maravilhoso!',created_at:new Date().toISOString()}
    ]);
    const avatar=p.avatar_url||`https://picsum.photos/seed/${p.id}/600/800`;
    const igv=p.igv_score||78;
    const avg=p.avg_rating||4.8;
    const match=Math.floor(60+Math.random()*30);

    // Hero using tinder-profile style
    let html=`<div style="position:relative;height:420px;background:url('${avatar}') center/cover;border-radius:28px 28px 0 0;overflow:hidden">
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,15,0.95) 10%,rgba(8,8,15,0.3) 50%,transparent)"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;z-index:2">
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div><div style="font-size:28px;font-weight:800;color:white;line-height:1.1">${esc(p.name)}</div><div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px">${esc(p.specialty||'Profissional')} • ${esc(p.city||'Curitiba')}</div></div>
          <div style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800">${match}% match</div>
        </div>
      </div>
    </div>`;

    html+=`<div style="padding:18px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:white">★ ${avg.toFixed(1)}</div><div style="font-size:10px;color:#94a3b8">AVG</div></div>
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:white">${igv}</div><div style="font-size:10px;color:#94a3b8">IGV</div></div>
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:white">${p.total_reviews||reviews.length}</div><div style="font-size:10px;color:#94a3b8">REVIEWS</div></div>
      </div>

      ${renderGauge(igv,'IGV')}
      ${renderDist(reviews)}

      ${renderWhy(p)}
      ${renderClientReviews(reviews)}
      ${renderEstReviews([])}
      ${renderExp(p)}
      ${renderStyleMain([...(p.music_tags||[]),...(p.visual_tags||[]),...(p.work_tags||[]),'Eletrônico','Hip Hop','Streetwear','Clássico','Rápido'], new Set(['Hip Hop','Rápido']))}
      ${renderAffinity(p)}
    </div>`;

    contentEl.innerHTML=html;
    document.getElementById('backBtn').href='./explore.html';

    // Floating actions - professional: Avaliar, Contratar, Curtir, Fav
    document.getElementById('floatNav').innerHTML=`
      <button class="side-back show" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
      <a href="./explore.html"><span>🔍</span><span class="label">Explorar</span></a>
      <button class="center" onclick="location.href='./app-worker.html?id=${p.id}'"><span>⭐</span><span class="label">Avaliar</span></button>
      <button onclick="toastMsg('🤝 Convite enviado!');localStorage.setItem('invite_${p.id}','1')"><span>🤝</span><span class="label">Contratar</span></button>
      <button onclick="toggleLike('like_prof_${p.id}',this)"><span>❤️</span><span class="label">Curtir</span></button>
      <button onclick="toggleFav('fav_prof_${p.id}',this)"><span>🤍</span><span class="label">Favoritar</span></button>
      <a href="./explore.html"><span>✕</span><span class="label">Fechar</span></a>
      <button class="side-back show" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
    `;
  }catch(e){contentEl.innerHTML=`<p style="padding:40px;color:#ef4444;text-align:center">Erro: ${esc(e.message)}</p>`}
}

async function loadEstablishment(eid){
  try{
    const data=await rxFetch(`/rest/v1/establishments?id=eq.${eid}&select=*`);
    if(!data?.length) throw new Error('Estabelecimento não encontrado');
    const e=data[0];
    const reviews=await rxFetch(`/rest/v1/reviews?establishment_id=eq.${eid}&order=created_at.desc&limit=10`).catch(()=>[]);
    const avatar=e.avatar_url||`https://picsum.photos/seed/est-${e.id}/600/400`;
    const igv=Math.round((e.avg_rating||4.5)*18+10);
    const avg=e.avg_rating||4.6;

    let html=`<div style="position:relative;height:340px;background:url('${avatar}') center/cover;border-radius:28px 28px 0 0;overflow:hidden">
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,15,0.95),transparent)"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;z-index:2">
        <div style="font-size:26px;font-weight:800;color:white">🏢 ${esc(e.name)}</div><div style="font-size:13px;color:rgba(255,255,255,0.7)">${esc(e.type||'Estabelecimento')} • ${esc(e.city||'')} • ★ ${avg.toFixed(1)}</div>
      </div>
    </div>`;
    html+=`<div style="padding:18px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
        <div style="background:rgba(255,255,255,0.04);border-radius:16px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:white">★ ${avg.toFixed(1)}</div><div style="font-size:10px;color:#94a3b8">AVG</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:16px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:white">${igv}</div><div style="font-size:10px;color:#94a3b8">PROOFLY</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:16px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:white">${e.total_reviews||reviews.length||0}</div><div style="font-size:10px;color:#94a3b8">REVIEWS</div></div>
      </div>
      ${renderGauge(igv,'Proofly')}
      ${renderDist(reviews)}
      <div class="tinder-section"><div class="tinder-section-title">👥 Equipe atual</div><div id="teamList" style="font-size:13px;color:#94a3b8">Carregando equipe...</div></div>
      <div class="tinder-section"><div class="tinder-section-title">🏷️ Infra & Vibe</div><div style="display:flex;flex-wrap:wrap;gap:6px">${[...(e.infra_tags||[]),...(e.vibe_tags||[]),...(e.music_tags||[])].slice(0,10).map(t=>`<span style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#cbd5e1;padding:6px 12px;border-radius:999px;font-size:11px">${esc(t)}</span>`).join('')||'<span style="color:#64748b">Sem tags</span>'}</div></div>
    </div>`;

    contentEl.innerHTML=html;

    rxFetch(`/rest/v1/professionals?current_establishment_id=eq.${eid}&select=id,name,avatar_url,specialty,avg_rating&limit=8`).then(team=>{
      const el=document.getElementById('teamList'); if(!el) return;
      if(!team?.length) el.innerHTML='Nenhum profissional vinculado ainda';
      else el.innerHTML=team.map(p=>`<div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.04);border-radius:12px;padding:10px;margin-bottom:6px"><img src="${p.avatar_url||'https://i.pravatar.cc/100?u='+p.id}" style="width:36px;height:36px;border-radius:50%"/><div style="flex:1"><div style="font-weight:700;color:white;font-size:13px">${esc(p.name)}</div><div style="font-size:11px;color:#94a3b8">${esc(p.specialty||'')} • ★ ${p.avg_rating||0}</div></div><a href="./dedicated-profile.html?type=professional&id=${p.id}" style="font-size:11px;color:#a5b4fc">Ver perfil</a></div>`).join('');
    });

    document.getElementById('floatNav').innerHTML=`
      <button class="side-back show" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
      <a href="./explore.html"><span>🔍</span><span class="label">Explorar</span></a>
      <button class="center" onclick="location.href='./app-owner.html?id=${e.id}'"><span>⭐</span><span class="label">Avaliar</span></button>
      <button onclick="toggleLike('like_est_${e.id}',this)"><span>❤️</span><span class="label">Curtir</span></button>
      <button onclick="toggleFav('fav_est_${e.id}',this)"><span>🤍</span><span class="label">Favoritar</span></button>
      <a href="./explore.html"><span>✕</span><span class="label">Fechar</span></a>
      <button class="side-back show" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
    `;
  }catch(e){contentEl.innerHTML=`<p style="padding:40px;color:#ef4444;text-align:center">Erro: ${esc(e.message)}</p>`}
}

function toggleLike(k,btn){const cur=localStorage.getItem(k)==='1';localStorage.setItem(k,cur?'0':'1');toastMsg(cur?'💔 Descurtido':'❤️ Curtido!'); if(btn) btn.style.color=cur?'#9aa0b5':'#fda4af'}
function toggleFav(k,btn){const cur=localStorage.getItem(k)==='1';localStorage.setItem(k,cur?'0':'1');toastMsg(cur?'🤍 Removido':'💖 Favoritado!');}

if(!id){contentEl.innerHTML='<p style="padding:40px;text-align:center;color:#94a3b8">Sem ID</p>'}else{if(isEst) loadEstablishment(id); else loadProfessional(id)}
</script>
</body>
</html>
