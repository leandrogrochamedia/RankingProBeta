<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🏆 Ranking Pro — Perfil Premium</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <style>
    /* ============================================
       RANKING PRO — PERFIL PREMIUM APPLE DESIGN
       Modern Tinder Navigation + Data Visualization
       ============================================ */
    
    :root {
      /* Apple Dark Mode Palette */
      --bg-primary: #000000;
      --bg-secondary: #1c1c1e;
      --bg-tertiary: #2c2c2e;
      --bg-elevated: rgba(28, 28, 30, 0.8);
      
      /* Glass morphism */
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-blur: 20px;
      
      /* Text colors */
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --text-placeholder: rgba(255, 255, 255, 0.3);
      
      /* Accent colors */
      --accent-primary: #0A84FF;
      --accent-gradient: linear-gradient(135deg, #0A84FF 0%, #5E5CE6 100%);
      --gold: #FFD700;
      --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      --purple: #BF5AF2;
      --pink: #FF375F;
      --green: #30D158;
      --orange: #FF9F0A;
      --red: #FF453A;
      --blue: #0A84FF;
      --teal: #64D2FF;
      
      /* Rating colors */
      --star-filled: #FFD700;
      --star-empty: rgba(255, 255, 255, 0.2);
      
      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      
      /* Border radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 28px;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 40px rgba(10, 132, 255, 0.3);
      
      /* Animation */
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
    }
    
    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      transition: opacity var(--transition-slow), visibility var(--transition-slow);
    }
    
    .loading-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--bg-tertiary);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Main Container */
    .perfil-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 0;
    }
    
    /* Header */
    .perfil-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-lg);
      padding-top: calc(var(--spacing-md) + env(safe-area-inset-top, 0px));
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }
    
    .header-back {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    
    .header-back:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .header-back svg {
      width: 20px;
      height: 20px;
      color: var(--text-primary);
    }
    
    .header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    
    .header-action {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    
    .header-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .header-action svg {
      width: 20px;
      height: 20px;
      color: var(--text-primary);
    }
    
    /* Hero Section */
    .hero-section {
      position: relative;
      height: 420px;
      overflow: hidden;
    }
    
    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        transparent 40%,
        rgba(0, 0, 0, 0.3) 60%,
        rgba(0, 0, 0, 0.8) 100%
      );
    }
    
    .hero-badge {
      position: absolute;
      top: var(--spacing-lg);
      right: var(--spacing-lg);
      padding: var(--spacing-xs) var(--spacing-md);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--green);
    }
    
    /* Profile Info Card */
    .profile-info-card {
      margin: -60px var(--spacing-lg) var(--spacing-lg);
      position: relative;
      z-index: 10;
    }
    
    .avatar-container {
      display: flex;
      justify-content: center;
      margin-bottom: var(--spacing-md);
    }
    
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
    }
    
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg-primary);
      background: var(--bg-tertiary);
      box-shadow: var(--shadow-lg);
    }
    
    .avatar-fallback {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--bg-primary);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      box-shadow: var(--shadow-lg);
    }
    
    .verified-check {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 32px;
      height: 32px;
      background: var(--green);
      border-radius: 50%;
      border: 3px solid var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    
    .profile-name {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: var(--spacing-xs);
    }
    
    .profile-specialty {
      text-align: center;
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
    }
    
    .profile-location {
      text-align: center;
      font-size: 14px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-xs);
    }
    
    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-md);
      padding: 0 var(--spacing-lg) var(--spacing-lg);
    }
    
    .stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--spacing-lg);
      text-align: center;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: var(--transition-base);
    }
    
    .stat-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
    
    .stat-icon {
      font-size: 24px;
      margin-bottom: var(--spacing-sm);
    }
    
    .stat-value {
      display: block;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }
    
    .stat-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: var(--spacing-md);
      padding: 0 var(--spacing-lg) var(--spacing-lg);
    }
    
    .btn-primary {
      flex: 1;
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-lg);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-base);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }
    
    .btn-secondary {
      width: 52px;
      height: 52px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition-base);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .btn-secondary svg {
      width: 22px;
      height: 22px;
    }
    
    /* Section Titles */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      padding: var(--spacing-xl) var(--spacing-lg) var(--spacing-md);
      letter-spacing: -0.01em;
    }
    
    /* Rating Distribution Chart */
    .rating-chart-card {
      margin: 0 var(--spacing-lg) var(--spacing-lg);
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      padding: var(--spacing-lg);
      border: 1px solid var(--glass-border);
    }
    
    .rating-chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-lg);
    }
    
    .rating-chart-title {
      font-size: 16px;
      font-weight: 600;
    }
    
    .rating-chart-average {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    
    .average-score {
      font-size: 36px;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .average-stars {
      color: var(--star-filled);
      font-size: 18px;
      letter-spacing: 2px;
    }
    
    .rating-bars {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .rating-bar-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    
    .rating-bar-label {
      width: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
    }
    
    .rating-bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    
    .rating-bar-fill {
      height: 100%;
      background: var(--gold-gradient);
      border-radius: var(--radius-full);
      transition: width var(--transition-slow);
    }
    
    .rating-bar-count {
      width: 32px;
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: right;
    }
    
    /* Ranking Badge */
    .ranking-card {
      margin: 0 var(--spacing-lg) var(--spacing-lg);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 165, 0, 0.08) 100%);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: var(--radius-xl);
      padding: var(--spacing-lg);
      display: flex;
      align-items: center;
      gap: var(--spacing-lg);
    }
    
    .ranking-icon {
      width: 64px;
      height: 64px;
      background: var(--gold-gradient);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
    }
    
    .ranking-info {
      flex: 1;
    }
    
    .ranking-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--spacing-xs);
    }
    
    .ranking-tier {
      font-size: 24px;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--spacing-xs);
    }
    
    .ranking-percentile {
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    /* Skills/Tags */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
      padding: 0 var(--spacing-lg) var(--spacing-lg);
    }
    
    .tag-chip {
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: var(--transition-fast);
    }
    
    .tag-chip:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }
    
    /* Reviews Section */
    .reviews-section {
      padding: 0 var(--spacing-lg) var(--spacing-lg);
    }
    
    .review-card {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      transition: var(--transition-base);
    }
    
    .review-card:hover {
      background: var(--bg-tertiary);
    }
    
    .review-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }
    
    .reviewer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }
    
    .reviewer-info {
      flex: 1;
    }
    
    .reviewer-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .review-date {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    
    .review-rating {
      color: var(--star-filled);
      font-size: 16px;
      letter-spacing: 2px;
    }
    
    .review-comment {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    
    .verified-review-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      background: rgba(48, 209, 88, 0.15);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      margin-left: var(--spacing-sm);
    }
    
    /* Contact Section */
    .contact-card {
      margin: 0 var(--spacing-lg) var(--spacing-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--spacing-lg);
    }
    
    .contact-bio {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-lg);
    }
    
    .contact-buttons {
      display: flex;
      gap: var(--spacing-md);
    }
    
    .contact-btn {
      flex: 1;
      padding: var(--spacing-md);
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      transition: var(--transition-base);
    }
    
    .contact-btn svg {
      width: 18px;
      height: 18px;
    }
    
    .btn-whatsapp {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .btn-whatsapp:hover {
      background: rgba(34, 197, 94, 0.25);
    }
    
    .btn-instagram {
      background: rgba(236, 72, 153, 0.15);
      color: #f9a8d4;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
    
    .btn-instagram:hover {
      background: rgba(236, 72, 153, 0.25);
    }
    
    /* QR Code Section */
    .qr-section {
      margin: 0 var(--spacing-lg) var(--spacing-lg);
      text-align: center;
    }
    
    .qr-card {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--spacing-lg);
      display: inline-block;
    }
    
    .qr-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-md);
    }
    
    .qr-code-img {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-md);
      background: #fff;
      padding: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    
    .btn-download-qr {
      padding: var(--spacing-sm) var(--spacing-lg);
      background: transparent;
      border: 1px solid var(--accent-primary);
      border-radius: var(--radius-full);
      color: var(--accent-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-base);
    }
    
    .btn-download-qr:hover {
      background: rgba(10, 132, 255, 0.15);
    }
    
    /* Team Section (for establishments) */
    .team-list {
      list-style: none;
      padding: 0 var(--spacing-lg) var(--spacing-lg);
    }
    
    .team-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--spacing-sm);
      text-decoration: none;
      color: inherit;
      transition: var(--transition-base);
    }
    
    .team-item:hover {
      background: var(--bg-tertiary);
      transform: translateX(4px);
    }
    
    .team-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-tertiary);
      flex-shrink: 0;
    }
    
    .team-avatar-fallback {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    
    .team-info {
      flex: 1;
    }
    
    .team-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .team-rating {
      display: block;
      font-size: 13px;
      color: var(--star-filled);
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--text-tertiary);
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: var(--spacing-md);
      opacity: 0.5;
    }
    
    /* Error State */
    .error-state {

      margin-bottom: var(--spacing-sm);

    .error-state p {

    /* Animations */
    @keyframes fadeInUp {

        transform: translateY(20px);

      to {

        transform: translateY(0);
      }

    .animate-in {

    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }

    /* Responsive */
    @media (max-width: 480px) {
