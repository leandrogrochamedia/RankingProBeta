<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⭐ Minhas Avaliações — Ranking Pro</title>
  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    .reviews-page { max-width: 720px; margin: 32px auto 80px; padding: 0 20px; }
    .reviews-page h1 { font-size: 26px; color: #0f172a; margin-bottom: 6px; }
    .reviews-page .sub { color: #64748b; margin-bottom: 24px; }
    .review-card {
      background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
      border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .review-card-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .review-card strong { color: #0f172a; }
    .review-stars { color: #f59e0b; font-weight: 700; }
    .review-meta { font-size: 12px; color: #94a3b8; }
    .review-comment { margin-top: 8px; color: #334155; line-height: 1.5; font-size: 14px; }
    .review-type { font-size: 11px; color: #6366f1; font-weight: 600; margin-top: 6px; }
    .empty-box { text-align: center; padding: 40px 20px; color: #64748b; }
  </style>
</head>
<body>
  <div id="userMessage" class="user-message" style="display:none;"></div>
  <div class="reviews-page">
    <h1>⭐ Minhas Avaliações</h1>
    <p class="sub">Avaliações que você enviou como cliente.</p>
    <div id="reviewList"><p class="empty-box">Carregando...</p></div>
  </div>

  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./api.js"></script>
  <script src="./session.js"></script>
  <script src="./user-service.js"></script>
  <script src="./menu-lateral.js"></script>

  <script>
    const TYPE_LABELS = {
      client_to_professional: 'Cliente → Profissional',
      client_to_establishment: 'Cliente → Estabelecimento'
    };

    async function loadReviews() {
      const list = document.getElementById('reviewList');
      const sess = typeof getSession === 'function' ? getSession() : null;
      if (!sess?.userId) {
        list.innerHTML = '<div class="empty-box">Faça login como cliente para ver suas avaliações.<br><a href="./login.html">Entrar</a></div>';
        return;
      }

      try {
        const data = await fetchAPI(
          `/rest/v1/reviews?user_id=eq.${sess.userId}&review_type=in.(client_to_professional,client_to_establishment)&select=id,rating,comment,created_at,review_type,professional:professionals!professional_id(id,name),establishment:establishments!establishment_id(id,name)&order=created_at.desc&limit=50`
        );
        if (!data?.length) {
          list.innerHTML = '<div class="empty-box">Você ainda não avaliou ninguém. <a href="./cliente.html">Buscar profissionais</a></div>';
          return;
        }
        list.innerHTML = data.map(r => {
          const target = r.professional?.name || r.establishment?.name || 'Perfil';
          const tipo = TYPE_LABELS[r.review_type] || r.review_type;
          const date = r.created_at ? new Date(r.created_at).toLocaleDateString('pt-BR') : '';
          const stars = typeof renderStars === 'function' ? renderStars(r.rating) : '★'.repeat(r.rating || 0);
          return `
            <article class="review-card">
              <div class="review-card-head">
                <div><strong>${escapeHtml(target)}</strong><div class="review-type">${escapeHtml(tipo)}</div></div>
                <div style="text-align:right"><span class="review-stars">${stars}</span><div class="review-meta">${escapeHtml(date)}</div></div>
              </div>
              <p class="review-comment">${escapeHtml(r.comment || 'Sem comentário')}</p>
            </article>
          `;
        }).join('');
      } catch (e) {
        list.innerHTML = `<div class="empty-box">Erro ao carregar: ${escapeHtml(e.message)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadReviews);
  </script>
</body>
</html>
