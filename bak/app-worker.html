<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rank-X — App Worker</title><link rel="stylesheet" href="./rankx-core.css"></head>
<body>
<div class="rx-container">
  <div class="rx-topbar"><div><span style="font-size:12px;color:#10b981;font-weight:700">● WORKER</span><h1 class="rx-page-title" style="font-size:22px">Seu Dashboard</h1></div><div class="rx-row"><button class="rx-btn rx-btn--ghost rx-btn--sm">✏️ Editar</button><a href="./choose-role.html" class="rx-btn rx-btn--ghost rx-btn--sm">Sair</a></div></div>
  
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:16px;">
    <div class="rx-card rx-card--glass"><div style="font-size:28px; font-weight:800">4.9</div><div style="font-size:12px;color:#94a3b8">Avg Rating • 42 reviews</div></div>
    <div class="rx-card"><div style="font-size:28px; font-weight:800">92</div><div style="font-size:12px;color:#64748b">IGV Score • Top 5%</div></div>
  </div>

  <div class="rx-card rx-card--dark" style="margin-top:16px;">
    <h3>📱 Seu QR Code</h3><p style="font-size:13px;color:#94a3b8; margin:6px 0 12px">Mostre para o cliente após o atendimento. Cada QR é único e não reutilizável.</p>
    <div style="background:white; width:160px; height:160px; border-radius:12px; margin:0 auto; display:flex; align-items:center; justify-content:center; color:black; font-weight:800;">QR DO LEANDRO</div>
    <div class="rx-row" style="justify-content:center; margin-top:12px"><button class="rx-btn rx-btn--primary rx-btn--sm">Gerar novo QR</button><button class="rx-btn rx-btn--ghost rx-btn--sm">Copiar link da página</button></div>
  </div>

  <div class="rx-card" style="margin-top:16px;"><h3>⭐ Últimas avaliações verificadas</h3><div class="rx-list" style="margin-top:12px"><div class="rx-list-item"><span>★★★★★ — Corte impecável</span><span style="font-size:12px;color:#10b981">Verificada via QR</span></div><div class="rx-list-item"><span>★★★★★ — Atendimento top</span><span style="font-size:12px;color:#10b981">Verificada</span></div></div></div>
</div>
</body>
</html>
