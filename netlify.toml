[build]
  command = "sh scripts/build-config.sh"
  publish = "dist"

[[redirects]]
  from = "/qr"
  to = "/qr/"
  status = 301

[[redirects]]
  from = "/avaliar"
  to = "/avaliar/"
  status = 301

[[redirects]]
  from = "/p"
  to = "/p/"
  status = 301

[[redirects]]
  from = "/cliente-area.html"
  to = "/selecionar-cliente.html"
  status = 301

[[redirects]]
  from = "/cliente-avaliar.html"
  to = "/cliente.html"
  status = 301

[[redirects]]
  from = "/---perfil-publico.html"
  to = "/perfil-page.html"
  status = 301

[[redirects]]
  from = "/---minhas-avaliacoes.html"
  to = "/minhas-avaliacoes.html"
  status = 301

[[redirects]]
  from = "/----vincular-profissional.html"
  to = "/selecionar-profissional.html?force=true"
  status = 301

[[redirects]]
  from = "/---onboarding-cliente.html"
  to = "/cadastro-cliente.html"
  status = 301

[[redirects]]
  from = "/BASE DE DADOS COMPLETA.html"
  to = "/base-de-dados-completa.html"
  status = 301

# SPA-lite (hash router) — fallback só quando migrar history mode:
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"