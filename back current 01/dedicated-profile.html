<link rel="stylesheet" href="./rankx-core.css"/>

<style>
body{background:#08080f}
.dedicated-shell{max-width:860px;margin:0 auto;padding:16px 16px 160px}
.back-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,0.08);color:#eaeaea;font-weight:600;font-size:14px;text-decoration:none;backdrop-filter:blur(20px);margin-bottom:16px}
.dedicated-content{border-radius:28px;overflow:hidden;background:#0f0f1e;border:1px solid rgba(255,255,255,0.06)}
/* Float nav beautiful like explorer */
.rx-float-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(18,18,30,0.92);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,0.10);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:4px;z-index:900;box-shadow:0 12px 40px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06)}
.rx-float-nav a,.rx-float-nav button{position:relative;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9aa0b5;background:transparent;border:none;cursor:pointer;transition:all .2s;flex-shrink:0;font-size:18px}
.rx-float-nav a:hover,.rx-float-nav button:hover{background:rgba(255,255,255,0.08);color:#e2e8f0}
.rx-float-nav .is-active{color:white;background:rgba(255,255,255,0.10)}
.rx-float-nav .center{width:52px;height:52px;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);color:white;box-shadow:0 6px 20px rgba(99,102,241,0.5);margin:0 4px}
.rx-float-nav .label{position:absolute;bottom:54px;left:50%;transform:translateX(-50%) translateY(6px);background:rgba(26,26,46,0.96);color:#e2e8f0;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap;border:1px solid rgba(255,255,255,0.10);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.rx-float-nav a:hover .label,.rx-float-nav button:hover .label{opacity:1;transform:translateX(-50%) translateY(0)}
.rx-float-nav .side-back{width:0;height:38px;opacity:0;pointer-events:none;overflow:hidden;border-radius:999px;background:rgba(99,102,241,0.18);border:1px solid rgba(99,102,241,0.25);color:#a5b4fc;display:flex;align-items:center;justify-content:center;transition:all .36s cubic-bezier(.16,1,.3,1);flex-shrink:0;margin:0}
.rx-float-nav .side-back.show{width:42px;opacity:1;pointer-events:auto;margin:0 2px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#e2e8f0;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .32s;z-index:3000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){.rx-float-nav{bottom:12px;padding:6px 8px;gap:2px}.rx-float-nav a,.rx-float-nav button{width:38px;height:38px}.rx-float-nav .center{width:48px;height:48px}.rx-float-nav .label{display:none}}
/* Overrides to make tinder sections look vivid inside dedicated page */
.tinder-profile-hero{position:relative;border-radius:28px 28px 0 0;overflow:hidden}
.tinder-profile-hero img{width:100%;height:420px;object-fit:cover;display:block}
.tinder-profile-hero .hero-fallback{width:100%;height:420px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1e293b,#312e81);color:white;font-size:48px;font-weight:800}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,15,0.95) 15%,rgba(8,8,15,0.4) 50%,transparent);pointer-events:none}
.hero-top-badges{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:3}
.hero-bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.hero-rating-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.12)}
.hero-fotos-pill{background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);color:white;font-size:12px;font-weight:700}
.tinder-hero-identity{padding:20px;background:#0f0f1e}
.hero-name{font-size:28px;font-weight:800;color:white;line-height:1.1}
.hero-specialty{font-size:14px;color:#94a3b8;margin-top:4px}
.hero-meta-lines{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.hero-meta-line{font-size:13px;color:#cbd5e1;display:flex;gap:6px;align-items:center}
.hero-meta-line a{color:#93c5fd;text-decoration:underline}
.tinder-section{margin:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:16px}
</style>
</head>

<div class="toast" id="toast"></div>
<div class="dedicated-shell">

<a href="./explore.html" class="is-active"><span>🔍</span><span class="label">Explorar</span></a>

<script>
function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function stars(r){const n=Math.round(r||0);return '★'.repeat(n)+'☆'.repeat(5-n)}
const qs=new URLSearchParams(location.search);
let tipo=(qs.get('type')||qs.get('tipo')||'professional').toLowerCase();
let isEst = tipo.includes('estab')||tipo.includes('owner');
let id=qs.get('id')||qs.get('professionalId')||qs.get('establishmentId');
const contentEl=document.getElementById('content');

function parseTags(raw){
  if(!raw) return [];
  if(Array.isArray(raw)) return raw;
  if(typeof raw==='string'){
    try{ const p=JSON.parse(raw); if(Array.isArray(p)) return p; }catch{}
    return raw.split(',').map(s=>s.trim()).filter(Boolean);
  }
  return [];
}

function emojiFor(tag){
  const m={'Eletrônico':'🪩','Hip Hop':'🎧','Streetwear':'👕','Clássico':'🎻','Rápido':'⚡','Detalhista':'🔍','Comunicativo':'🗣️','Bebe socialmente':'🍻','Não fuma':'🚭','Esportista':'⛹️','Especialista':'🎯','Experiente':'⭐','Popular':'🔥','Generalista':'🛠️'};
  return m[tag]||'✨';
}

function renderHero(p, avg, total, photos){
  const avatar=photos[0]||p.avatar_url||`https://picsum.photos/seed/${p.id}/600/800`;
  const score=p.igv_score||50;
  const tier = score>=80?'Elite':score>=60?'Forte':score>=40?'Sólido':'Em formação';
  const tierColor = score>=60?'#818cf8':score>=40?'#fbbf24':'#94a3b8';
  return `
    <div class="tinder-profile-hero">
      <img src="${avatar}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <div class="hero-fallback" style="display:none">${esc((p.name||'E').charAt(0))}</div>
      <div class="hero-overlay"></div>
      <div class="hero-top-badges">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);border:2px solid ${tierColor};display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div style="width:40px;height:40px;position:relative"><svg viewBox="0 0 36 36" style="transform:rotate(-90deg);width:100%;height:100%"><path fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/><path fill="none" stroke="${tierColor}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${score},100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/></svg><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:white">${esc(tier)}</span></div>
          </div>
          <div><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:.06em">🏆 RANKING PRO SCORE</div><div style="font-size:11px;color:rgba(255,255,255,0.9)">Construindo confiança</div><div style="font-size:18px;font-weight:900;color:white">${score}<span style="font-size:11px;opacity:.7">/100</span></div></div>
        </div>
      </div>
      <div class="hero-bottom-bar">
        <div class="hero-rating-pill"><span style="color:#fbbf24;font-size:13px">${stars(avg)} ${avg.toFixed(1)}</span><span style="font-size:11px;color:rgba(255,255,255,0.7)"> ${total} aval.</span></div>
        <div class="hero-fotos-pill">📷 ${photos.length} fotos</div>
      </div>
    </div>
    <div style="padding:12px 16px;background:rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:11px;font-weight:700;letter-spacing:.08em;color:#94a3b8">🖼️ EXPLORAR FOTOS</div>
      <div style="font-size:11px;background:rgba(99,102,241,0.15);color:#a5b4fc;padding:4px 10px;border-radius:999px">+${Math.max(0,photos.length-1)} ${photos.length>1?'+1':''}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 16px 16px;background:#0f0f1e">
      ${photos.slice(0,2).map(url=>`<div style="height:140px;border-radius:14px;overflow:hidden;background:url('${url}') center/cover"></div>`).join('')||'<div style="height:100px;background:rgba(255,255,255,0.04);border-radius:14px"></div>'}
    </div>
  `;
}

function renderIdentity(p){
  const work = p.current_establishment_name||p.current_establishment?.name||'Clínica Estética Salão de Beleza';
  return `
    <div class="tinder-hero-identity">
      <div class="hero-name">${esc(p.name)}</div>
      <div class="hero-specialty">${esc(p.specialty||p.profile?.specialty||'Tricologista')}</div>
      <div class="hero-meta-lines">
        <div class="hero-meta-line">📍 <a href="./dedicated-profile.html?type=establishment&id=${p.current_establishment_id||''}">${esc(work)}</a></div>
        <div class="hero-meta-line">💰 $$$</div>
      </div>
    </div>
  `;
}

function renderCombina(matchPercent, shared){
  return `
    <div class="tinder-section" style="background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(139,92,246,0.12));border-color:rgba(99,102,241,0.2)">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;position:relative">
          <svg viewBox="0 0 36 36" style="width:48px;height:48px;transform:rotate(-90deg)"><path fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/><path fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="${matchPercent},100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/></svg>
          <span style="position:absolute;font-size:12px;font-weight:800;color:white">${matchPercent}%</span>
        </div>
        <div style="flex:1">
          <div style="display:inline-flex;background:#f97316;color:white;font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:4px">COMBINA COM VOCÊ</div>
          <div style="font-weight:700;color:white;font-size:14px">Combina com você · ${matchPercent}%</div>
          <div style="font-size:11px;color:#94a3b8">${shared.length} coisas em comum com o que você busca</div>
          <div style="display:flex;gap:6px;margin-top:8px">${shared.map(t=>`<span style="background:rgba(99,102,241,0.2);border:1px solid rgba(99,102,241,0.3);color:#c7d2fe;padding:4px 10px;border-radius:999px;font-size:11px">${emojiFor(t)} ${esc(t)}</span>`).join('')}</div>
        </div>
      </div>
    </div>
  `;
}

function renderReputacao(p, avg, total){
  const igv=p.igv_score||18;
  const clientes=p.total_reviews||2;
  return `
    <div class="tinder-section">
      <div style="display:flex;gap:14px;align-items:center">
        <div style="width:64px;height:64px;border-radius:50%;border:3px solid #fbbf24;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(251,191,36,0.1)"><span style="font-size:10px;font-weight:800;color:#fbbf24">Sólido</span></div>
        <div><div style="font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.06em">🏆 RANKING PRO SCORE</div><div style="font-size:11px;color:#94a3b8">Construindo confiança</div><div style="font-size:20px;font-weight:900;color:white">${p.igv_score||50}<span style="font-size:12px;opacity:.6">/100</span></div></div>
      </div>
      <div style="margin-top:16px"><div style="font-weight:700;color:white">Reputação Sólido</div><div style="font-size:12px;color:#94a3b8;margin-top:2px">Construindo confiança · Baseado em avaliações reais e atividade no Ranking Pro — não é auto-declarado.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><span style="font-size:11px;background:rgba(16,185,129,0.12);color:#6ee7b7;padding:5px 10px;border-radius:999px">+${clientes} clientes atendidos</span><span style="font-size:11px;background:rgba(99,102,241,0.12);color:#a5b4fc;padding:5px 10px;border-radius:999px">IGV ${igv}</span><span style="font-size:11px;background:rgba(16,185,129,0.12);color:#6ee7b7;padding:5px 10px;border-radius:999px">Nota clientes ${avg.toFixed(1)}</span></div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:#94a3b8"><span>👤 ${clientes} de clientes · média ${avg.toFixed(1)}</span></div>
      </div>
    </div>
  `;
}

function renderVerificavel(clientes, estabs, verificadas){
  return `
    <div class="tinder-section"><div class="tinder-section-title">🏆 Reputação verificável</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-top:2px solid #6366f1;border-radius:14px;padding:12px;text-align:center"><div style="font-size:10px;color:#94a3b8">👤 CLIENTES</div><div style="font-size:22px;font-weight:800;color:white;margin-top:4px">${clientes}</div><div style="font-size:10px;color:#94a3b8">Média 2.5 ★</div></div>
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-top:2px solid #64748b;border-radius:14px;padding:12px;text-align:center"><div style="font-size:10px;color:#94a3b8">🏢 ESTABELECIMENTOS</div><div style="font-size:22px;font-weight:800;color:white;margin-top:4px">${estabs}</div><div style="font-size:10px;color:#64748b">Sem avaliações ainda</div></div>
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-top:2px solid #10b981;border-radius:14px;padding:12px;text-align:center"><div style="font-size:10px;color:#94a3b8">✅ VERIFICADAS</div><div style="font-size:22px;font-weight:800;color:white;margin-top:4px">${verificadas}%</div><div style="font-size:10px;color:#64748b">via QR e identidade</div></div>
      </div>
    </div>
  `;
}

function renderContratantes(p){
  return `
    <div class="tinder-section"><div style="font-weight:700;color:white;display:flex;gap:8px">📋 Informações para Contratantes</div><div style="font-size:11px;color:#94a3b8;margin-top:2px">O que o dono da barbearia vê para decidir a contratação</div>
      <div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.18);border-radius:14px;padding:12px;margin-top:12px;display:flex;gap:10px"><span style="font-size:20px">👥</span><div><div style="font-weight:700;color:white;font-size:13px">Atendeu 148 clientes únicos no Ranking Pro</div><div style="font-size:11px;color:#94a3b8">Calculado automaticamente pelas avaliações no Ranking Pro</div></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:12px;text-align:center"><div style="font-size:14px;font-weight:800;color:white">—</div><div style="font-size:9px;font-weight:700;color:#fbbf24;margin-top:4px">ANOS DE PROFISSÃO</div><div style="font-size:8px;color:#64748b">tempo na área</div></div>

        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:12px;text-align:center"><div style="font-size:14px;font-weight:800;color:white">2a 8m</div><div style="font-size:9px;font-weight:700;color:#fbbf24;margin-top:4px">PERMANÊNCIA MÉDIA</div><div style="font-size:8px;color:#64748b">últimos empregos</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:800;color:white">21 anos</div><div style="font-size:9px;font-weight:700;color:#94a3b8">IDADE</div><div style="font-size:8px;color:#64748b">estimada</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:12px;text-align:center"><div style="font-size:13px;font-weight:800;color:white">R$ 2.000-3.000</div><div style="font-size:9px;font-weight:700;color:#fbbf24;margin-top:4px">PRETENSÃO SALARIAL</div><div style="font-size:8px;color:#64748b">comissão / salário</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:12px;text-align:center"><div style="font-size:14px;font-weight:800;color:white">—</div><div style="font-size:9px;font-weight:700;color:#fbbf24;margin-top:4px">RITMO APROXIMADO</div><div style="font-size:8px;color:#64748b">clientes por ano</div></div>
      </div>
      <div style="margin-top:12px"><div style="font-size:12px;font-weight:700;color:#94a3b8">💼 Estilo de trabalho</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span style="background:rgba(99,102,241,0.15);color:#a5b4fc;padding:6px 12px;border-radius:999px;font-size:11px">Experiente</span><span style="background:rgba(99,102,241,0.15);color:#a5b4fc;padding:6px 12px;border-radius:999px;font-size:11px">Popular</span><span style="background:rgba(99,102,241,0.15);color:#a5b4fc;padding:6px 12px;border-radius:999px;font-size:11px">Generalista</span></div><div style="font-size:10px;color:#64748b;margin-top:8px">Dados declarados pelo profissional + métricas reais do Ranking Pro (carteira e IGV não são auto-declarados).</div></div>

}

function renderEstiloPrincipal(tags, matched){
  return `<div class="tinder-section"><div class="tinder-section-title">✨ Estilo principal</div><div style="font-size:11px;color:#10b981;margin-bottom:10px">Tags que batem com o que você busca</div><div style="display:flex;flex-wrap:wrap;gap:8px">${tags.map(t=>`<span style="background:${matched.has(t)?'rgba(99,102,241,0.25)':'rgba(255,255,255,0.06)'};border:1px solid ${matched.has(t)?'rgba(99,102,241,0.4)':'rgba(255,255,255,0.08)'};color:${matched.has(t)?'#c7d2fe':'#e2e8f0'};padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600">${emojiFor(t)} ${esc(t)}</span>`).join('')}</div></div>`;
}

function renderAfinidade(prof){
  const cats=[
    {label:'Música',icon:'🎵',tags:parseTags(prof.music_tags).length?parseTags(prof.music_tags):['Eletrônico','Hip Hop']},
    {label:'Visual',icon:'👕',tags:parseTags(prof.visual_tags).length?parseTags(prof.visual_tags):['Streetwear','Clássico']},
    {label:'Personalidade',icon:'🧠',tags:parseTags(prof.personality_tags).length?parseTags(prof.personality_tags):['Rápido','Comunicativo','Detalhista']},
    {label:'Estilo de Vida',icon:'🌿',tags:parseTags(prof.lifestyle_tags).length?parseTags(prof.lifestyle_tags):['Bebe socialmente','Não fuma','Esportista']},
    {label:'Trabalho',icon:'💼',tags:parseTags(prof.work_tags).length?parseTags(prof.work_tags):['Especialista']}
  ];
  const matched=new Set(['Hip Hop','Rápido']);
  return `<div class="tinder-section"><div class="tinder-section-title">✨ Estilo & afinidade</div><div style="font-size:11px;color:#10b981;margin-bottom:12px">✓ Tags que batem com o que você busca</div>${cats.map(c=>`<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:#818cf8;margin-bottom:6px">${c.icon} ${c.label}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${c.tags.map(t=>`<span style="background:${matched.has(t)?'rgba(16,185,129,0.15)':'rgba(255,255,255,0.06)'};border:1px solid ${matched.has(t)?'rgba(16,185,129,0.3)':'rgba(255,255,255,0.08)'};color:${matched.has(t)?'#6ee7b7':'#cbd5e1'};padding:6px 12px;border-radius:999px;font-size:11px">${emojiFor(t)} ${esc(t)}</span>`).join('')}</div></div>`).join('')}</div>`;
}

function renderPorQue(tags){
  return `<div class="tinder-section"><div class="tinder-section-title">💡 Por que escolher?</div><ul style="list-style:none;padding:0;margin:0">${tags.map(t=>`<li style="display:flex;gap:8px;padding:6px 0;font-size:13px;color:#cbd5e1"><span>•</span><span>${emojiFor(t)} Destaque em ${esc(t)}</span></li>`).join('')}</ul></div>`;
}

function renderClientReviews(revs){
  if(!revs?.length) return `<div class="tinder-section"><div class="tinder-section-title">👤 Avaliações de clientes</div><p style="color:#64748b;font-size:13px">Nenhuma ainda</p></div>`;
  return `<div class="tinder-section"><div class="tinder-section-title">👤 Avaliações de clientes</div><div style="font-size:11px;color:#64748b;margin-bottom:10px">${revs.length} avaliações - origem real</div>${revs.map(r=>`<div style="background:rgba(255,255,255,0.04);border-radius:16px;padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span style="color:#fbbf24;font-size:12px">${stars(r.rating)} </span><span style="font-size:11px;color:#64748b">Há 1 meses</span></div><div style="font-weight:700;color:#a5b4fc;font-size:13px;margin-top:6px">Avaliador não identificado</div><div style="margin-top:6px"><span style="background:rgba(14,165,233,0.15);color:#7dd3fc;padding:3px 8px;border-radius:999px;font-size:10px">👤 Cliente</span></div><div style="font-size:11px;color:#94a3b8;margin-top:4px">Cliente avaliou este profissional</div><div style="font-size:13px;color:#cbd5e1;margin-top:8px">${esc(r.comment||'Muito bom, recomendo para todos.')}</div></div>`).join('')}</div>`;
}

function renderEstReviews(){
  return `<div class="tinder-section"><div class="tinder-section-title">🏢 Avaliações de estabelecimentos</div><div style="font-size:11px;color:#94a3b8">Nenhuma ainda</div><div style="font-size:13px;color:#cbd5e1;margin-top:6px">Estabelecimentos ainda não avaliaram.</div></div>`;
}

function renderExp(prof){
  let raw=prof.previous_workplaces;
  let exps;
  if(Array.isArray(raw)) exps=raw;
  else if(typeof raw==='string'&&raw.trim()){
    try{let p=JSON.parse(raw);exps=Array.isArray(p)?p:[raw];}catch{exps=raw.includes(',')?raw.split(',').map(s=>s.trim()).filter(Boolean):[raw];}
  } else exps=['Clínica Estética Salão de Beleza'];
  return `<div class="tinder-section"><div class="tinder-section-title">💼 Experiência</div>${exps.map((n,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(255,255,255,0.05);border-radius:14px;margin-bottom:8px;border-left:3px solid #6366f1"><div style="font-weight:700;color:#e2e8f0;font-size:13px">${esc(typeof n==='string'?n:n.name||'Estabelecimento')}</div><div style="display:flex;gap:8px;align-items:center">${i===0?'<span style="font-size:10px;background:rgba(16,185,129,0.2);color:#6ee7b7;padding:2px 8px;border-radius:999px">Atual</span>':''}<span style="font-size:11px;color:#64748b">— sem nota</span></div></div>`).join('')}</div>`;
}

async function loadProfessional(pid){
  try{
    const data=await rxFetch(`/rest/v1/professionals?id=eq.${pid}&select=*`);
    if(!data?.length) throw new Error('Profissional não encontrado');
    const p=data[0];
    const reviews=await rxFetch(`/rest/v1/reviews?professional_id=eq.${pid}&order=created_at.desc&limit=12`).catch(()=>[
      {rating:4,comment:'Muito bom, recomendo para todos.',created_at:new Date().toISOString()},
      {rating:2,comment:'Fiquei encantada com o resultado, maravilhoso!',created_at:new Date().toISOString()}
    ]);
    const photos=[p.avatar_url||`https://picsum.photos/seed/${p.id}/600/800`, `https://picsum.photos/seed/${p.id}a/600/400`].filter(Boolean);
    const avg=p.avg_rating||2.5;
    const total=p.total_reviews||reviews.length||2;
    const match=11;
    const shared=['Hip Hop','Rápido'];
    const allTags=[...(parseTags(p.music_tags)),...(parseTags(p.visual_tags)),...(parseTags(p.work_tags)),'Eletrônico','Hip Hop','Streetwear','Clássico','Rápido'];

    let html='';
    html+=renderHero(p, avg, total, photos);
    html+=renderIdentity(p);
    html+=renderCombina(match, shared);
    html+=renderReputacao(p, avg, total);
    html+=renderVerificavel(total, 0, 0);
    html+=renderContratantes(p);
    html+=renderEstiloPrincipal(allTags.slice(0,5), new Set(shared));
    html+=renderAfinidade(p);
    html+=renderPorQue(['Eletrônico','Hip Hop','Especialista']);
    html+=renderClientReviews(reviews);
    html+=renderEstReviews();
    html+=renderExp(p);

    contentEl.innerHTML=html;

    // Float nav - beautiful like explorer, with contextual actions
    document.getElementById('floatNav').innerHTML=`
      <button class="side-back show" onclick="history.back()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
      <a href="./explore.html"><span>🔍</span><span class="label">Explorar</span></a>
      <button class="center" onclick="location.href='./app-worker.html?id=${p.id}'"><span>⭐</span><span class="label">Avaliar</span></button>
      <button onclick="toastMsg('🤝 Convite enviado!');localStorage.setItem('invite_${p.id}','1')"><span>🤝</span><span class="label">Contratar</span></button>
      <button onclick="toggleLike('like_prof_${p.id}',this)"><span>❤️</span><span class="label">Curtir</span></button>
      <button onclick="toggleFav('fav_prof_${p.id}',this)"><span>🤍</span><span class="label">Favoritar</span></button>
      <a href="./explore.html"><span>✕</span><span class="label">Fechar</span></a>
      <button class="side-back show" onclick="history.back()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A2.5 2.5 0 0 1 17 11.5v7"/></svg></button>
    `;
  }catch(e){
    contentEl.innerHTML=`<p style="padding:40px;color:#ef4444;text-align:center">Erro: ${esc(e.message)}</p>`;
    console.error(e);
  }
}

function toggleLike(k,btn){const cur=localStorage.getItem(k)==='1';localStorage.setItem(k,cur?'0':'1');toastMsg(cur?'💔 Descurtido':'❤️ Curtido!');}
function toggleFav(k,btn){const cur=localStorage.getItem(k)==='1';localStorage.setItem(k,cur?'0':'1');toastMsg(cur?'🤍 Removido':'💖 Favoritado!');}

if(!id){contentEl.innerHTML='<p style="padding:40px;text-align:center;color:#94a3b8">Sem ID</p>'}else{if(isEst) location.href=`./dedicated-profile.html?type=establishment&id=${id}`.replace('dedicated-profile','dedicated-profile'); else loadProfessional(id)}
</script>
