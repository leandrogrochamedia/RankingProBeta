<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rank-X — Login</title>
<link rel="stylesheet" href="./rankx-core.css">
<style>
#rxLog{ display:none; background:#0f0f1e; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:12px; font-family:monospace; font-size:12px; color:#94a3b8; margin-top:12px; max-height:160px; overflow:auto; }
</style>
</head>
<body>
<div class="rx-container" style="max-width:420px; padding-top:60px;">
  <div class="rx-card">
    <div style="text-align:center; margin-bottom:20px;">
      <div style="font-size:36px">🏆</div>
      <h2 style="font-size:24px; margin-top:8px;">Entrar no Rank-X</h2>
      <p style="font-size:12px; color:#64748b; margin-top:4px;">Login fake Google conectado no Supabase</p>
    </div>

    <div class="rx-stack">
      <button id="btnGoogleFake" class="rx-btn" style="width:100%; background:white; color:#0f172a; border:1.5px solid #e2e8f0; border-radius:999px; padding:14px;" onclick="rxLoginFakeGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" style="margin-right:8px"> Entrar com Google (Leandro Rocha)
      </button>

      <div style="text-align:center; font-size:11px; color:#94a3b8;">— ou —</div>
      
      <input id="emailInput" class="rx-input" value="leandrogrocha@gmail.com">
      <input class="rx-input" type="password" value="123456" placeholder="senha demo">
      
      <button class="rx-btn rx-btn--primary" style="width:100%" onclick="rxLoginFakeGoogle()">🚀 Entrar como Leandro</button>

      <div id="rxLog"></div>

      <div class="rx-alert rx-alert--info" style="font-size:12px;">
        <span>ℹ️</span>
        <span><b>Motor:</b> vai buscar <code>leandrogrocha@gmail.com</code> no Supabase, se não achar tenta <code>leandro@proofly.com</code>, se não achar cria. Depois salva em <code>sessionStorage rankx_session</code> e vai pra choose-role.</span>
      </div>

      <a href="./index.html" style="text-align:center; font-size:13px; color:#6366f1; text-decoration:none; font-weight:600;">← Voltar ao início</a>
    </div>
  </div>
</div>

<script src="./rankx-config.js"></script>
<script src="./rankx-api.js"></script>
<script src="./rankx-session.js"></script>
<script src="./rankx-app.js"></script>
<script src="./rankx-auth.js"></script>
<script>
// Auto-preenche email se digitado
document.getElementById('emailInput')?.addEventListener('change', e=>{
  window.DEFAULT_USER_EMAIL = e.target.value;
});
</script>
</body>
</html>
