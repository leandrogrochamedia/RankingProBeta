<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rank-X — Carregando</title><link rel="stylesheet" href="./rankx-core.css">
<style>
body{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:#08080f; }
.loading-wrap{ text-align:center; }
.loading-logo{ font-size:56px; animation: pulse 1.2s infinite; }
.loading-title{ font-size:22px; font-weight:800; margin-top:12px; letter-spacing:-.02em; }
.loading-bar{ width:140px; height:3px; background: rgba(255,255,255,.08); border-radius:999px; overflow:hidden; margin:16px auto 0; }
.loading-bar-inner{ height:100%; width:40%; background: linear-gradient(90deg,#6366f1,#8b5cf6); border-radius:999px; animation: move 1s infinite ease-in-out; }
@keyframes pulse{0%,100%{opacity:.5; transform:scale(.96)}50%{opacity:1; transform:scale(1)}}
@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style></head>
<body>
<div class="loading-wrap">
  <div class="loading-logo">🏆</div>
  <div class="loading-title">Rank-X</div>
  <div style="font-size:12px; color:#64748b; margin-top:4px;">Reputação verificada carregando...</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
</div>
<script>setTimeout(()=> location.href='./explore.html', 1800);</script>
</body>
</html>
