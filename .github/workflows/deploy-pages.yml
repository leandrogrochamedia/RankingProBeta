name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare config.js
        run: |
          cp config.example.js config.js
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            sed -i "s/sua-anon-key-aqui/${{ secrets.SUPABASE_ANON_KEY }}/" config.js
          else
            sed -i "s/sua-anon-key-aqui/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5eXdkaGpzdHZobWFydnppamppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzODE4NTEsImV4cCI6MjA5Njk1Nzg1MX0.uLu4Xhazrrrmf9MCp7BzZFUYLBR1J8QHQmqp0f3E1Yg/" config.js
          fi
          # peaceiris/actions-gh-pages respects .gitignore — allow config.js no artefato publicado
          sed -i '/^config\.js$/d' .gitignore

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: '.github,devtasks,logs,scripts,migrations,sql,ani coach,coach,ver bug'